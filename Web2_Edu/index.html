<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Simples</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Minha Agenda</h1>

    <form id="form">
      <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required placeholder="Ex: Reunião com fornecedor" />
      </div>
      <div class="form-group">
        <label for="data">Data e hora</label>
        <input type="datetime-local" id="data" required />
      </div>
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Detalhes do compromisso..."></textarea>
      </div>
      <button type="submit">Adicionar compromisso</button>
    </form>

    <div class="filtros">
      <button class="ativo" onclick="definirFiltro('todos')">Todos</button>
      <button onclick="definirFiltro('pendentes')">Pendentes</button>
      <button onclick="definirFiltro('concluidos')">Concluídos</button>
    </div>

    <ul id="lista"></ul>
    <p id="vazio" class="vazio">Nenhum compromisso cadastrado.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
